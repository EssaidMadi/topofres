name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Not secret (the IP is already public via DNS) — edit these two if your
  # CloudPanel site uses a different system user or path than the default.
  VPS_HOST: "76.13.114.85"
  VPS_USER: "bestdealsplus"
  VPS_PATH: "/home/bestdealsplus/htdocs/bestdealsplus.com"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - run: npm ci
      - run: npm run build

      # Ship everything the running app needs except dev-only files —
      # node_modules is reinstalled --omit=dev on the server so native/
      # platform-specific deps (none today, but be safe) match its OS.
      - name: Sync files to the VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete --exclude=".git" --exclude="node_modules" --exclude="data"
          path: ./
          remote_path: ${{ env.VPS_PATH }}
          remote_host: ${{ env.VPS_HOST }}
          remote_user: ${{ env.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install prod deps and restart the app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.VPS_PATH }}"
            npm ci --omit=dev
            pm2 restart bestdealsplus || pm2 start dist/web/server.js --name bestdealsplus
            pm2 save
