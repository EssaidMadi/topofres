name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Not secret (the IP is already public via DNS) — edit these if your
  # CloudPanel site uses different values than the ones confirmed on the VPS.
  VPS_HOST: "76.13.114.85"
  VPS_USER: "admin-essaid"
  VPS_PATH: "/home/admin-essaid/htdocs/bestdealsplus.com"
  # Port 3000 is already taken by another site (admin.arthome.ai) on this
  # shared VPS — 3012 is the port set in CloudPanel's Node.js app config.
  APP_PORT: "3012"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - run: npm ci
      - run: npm run build

      # Ship everything the running app needs except dev-only files —
      # node_modules is reinstalled --omit=dev on the server so native/
      # platform-specific deps (none today, but be safe) match its OS.
      - name: Sync files to the VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete --exclude=".git" --exclude="node_modules" --exclude="data"
          path: ./
          remote_path: ${{ env.VPS_PATH }}
          remote_host: ${{ env.VPS_HOST }}
          remote_user: ${{ env.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install prod deps and restart the app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # nvm.sh isn't sourced by su/non-interactive SSH (confirmed: it
            # doesn't even exist at $NVM_DIR/nvm.sh on this box — CloudPanel
            # manages Node versions its own way, not via a real nvm install
            # for the shell). Point straight at the known binary instead of
            # depending on PATH/nvm resolution at all.
            NODE_BIN="$HOME/.nvm/versions/node/v22.23.2/bin/node"
            NPM_BIN="$HOME/.nvm/versions/node/v22.23.2/bin/npm"
            if [ ! -x "$NODE_BIN" ]; then
              echo "Expected Node at $NODE_BIN, not found. Installed versions:"
              ls "$HOME/.nvm/versions/node/" 2>&1 || echo "(no ~/.nvm/versions/node/ at all)"
              exit 1
            fi
            echo "Using node: $NODE_BIN ($("$NODE_BIN" -v))"

            cd "${{ env.VPS_PATH }}"
            "$NPM_BIN" ci --omit=dev

            # Delete + fresh start on every deploy rather than `restart` —
            # restart keeps whatever interpreter/env the process was
            # originally started with, which is exactly what bit us here.
            pm2 delete bestdealsplus 2>/dev/null || true
            PORT="${{ env.APP_PORT }}" pm2 start dist/web/server.js --name bestdealsplus --interpreter "$NODE_BIN"
            pm2 save
